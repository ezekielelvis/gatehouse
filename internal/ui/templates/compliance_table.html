{{define "compliance_table"}}
<div class="table-wrap">
<table class="table">
  <thead><tr><th>Control</th><th>Status</th><th>Title</th><th>Evidence</th></tr></thead>
  <tbody>
  {{range .Compliance.Rows}}<tr>
    <td class="mono">{{.ID}}</td>
    <td>{{template "statusCell" .}}</td>
    <td>{{.Title}}</td>
    <td class="muted">{{.Detail}}</td>
  </tr>{{end}}
  </tbody>
</table>
</div>
<p class="panel-caption" style="margin-top:12px">{{.Compliance.Summary}} — 'manual' controls require human attestation; Gatehouse does not auto-pass them.</p>
{{end}}
