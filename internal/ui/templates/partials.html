{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Gatehouse</title>
<script src="/static/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
<style>
/* Fonts (vendored, served locally) — Dosis for reading, DynaPuff for labels. */
@font-face{font-family:Dosis;font-weight:400;font-display:swap;src:url(/static/fonts/dosis-400.woff2) format("woff2")}
@font-face{font-family:Dosis;font-weight:500;font-display:swap;src:url(/static/fonts/dosis-500.woff2) format("woff2")}
@font-face{font-family:Dosis;font-weight:600;font-display:swap;src:url(/static/fonts/dosis-600.woff2) format("woff2")}
@font-face{font-family:DynaPuff;font-weight:400;font-display:swap;src:url(/static/fonts/dynapuff-400.woff2) format("woff2")}
@font-face{font-family:DynaPuff;font-weight:600;font-display:swap;src:url(/static/fonts/dynapuff-600.woff2) format("woff2")}

:root{
  color-scheme:light;
  --body:Dosis,system-ui,sans-serif; --display:DynaPuff,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg:#fff; --canvas:#f4f4f3; --raise:#fff; --card:rgba(255,255,255,.4);
  --ink:#3a3a3a; --ink-2:#5c5c5a; --ink-strong:#1f1f1f; --on-ink:#fff;
  --line:#c4c4c4; --line-soft:#e2e2e0; --muted:#8a8a88; --grid:#e7e7e4;
  --green:#16a34a; --red:#dc2626; --warn:#c4561f; --info:#3f73bf; --purple:#8a63b8;
  --ease-out:cubic-bezier(.23,1,.32,1); --t-fast:180ms; --t-base:240ms;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow-2xl:0 25px 50px -12px rgb(0 0 0 / .25);
}
:root.dark{
  color-scheme:dark;
  --bg:#18181b; --canvas:#1d1d20; --raise:#1f1f22; --card:rgba(24,24,27,.4);
  --ink:#c4c4c0; --ink-2:#a3a3a0; --ink-strong:#ececea; --on-ink:#18181b;
  --line:#3a3a38; --line-soft:#2a2a28; --muted:#7d7d7a; --grid:#2a2a28;
  --green:#22c55e; --red:#f05a5a; --warn:#e07a45; --info:#4f7fc9; --purple:#9a7bc9;
  --shadow-2xl:0 25px 50px -12px rgb(0 0 0 / .6);
}
@media (prefers-color-scheme:dark){:root:not(.light){
  color-scheme:dark;
  --bg:#18181b; --canvas:#1d1d20; --raise:#1f1f22; --card:rgba(24,24,27,.4);
  --ink:#c4c4c0; --ink-2:#a3a3a0; --ink-strong:#ececea; --on-ink:#18181b;
  --line:#3a3a38; --line-soft:#2a2a28; --muted:#7d7d7a; --grid:#2a2a28;
  --green:#22c55e; --red:#f05a5a; --warn:#e07a45; --info:#4f7fc9; --purple:#9a7bc9;
}}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  -webkit-font-smoothing:antialiased;transition:background-color var(--t-base) ease,color var(--t-base) ease}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600}
p{margin:0}
a{color:inherit;text-decoration:none}
a.primary:hover,a.plain:hover{text-decoration:underline;text-underline-offset:2px}
code{font-family:var(--mono);font-size:.86em}
.code{margin:0;padding:12px 14px;overflow:auto;max-height:420px;background:var(--canvas);
  border:1px solid var(--line-soft);border-radius:var(--r-md);font:12.5px/1.55 var(--mono);color:var(--ink);white-space:pre}
.snippet{margin:8px 0 0}
.snippet .hl{background:color-mix(in srgb,var(--red) 14%,transparent);display:block}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:.86em}
.label{font-family:var(--display);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* shell: sidebar + main */
.app{min-height:100%;display:grid;grid-template-columns:232px minmax(0,1fr)}
.main{min-width:0;display:flex;flex-direction:column}
.sidebar{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:10px;
  padding:16px 12px;border-right:1px solid var(--line-soft);background:var(--bg);overflow-y:auto}
.wordmark{display:inline-flex;align-items:center;gap:9px;padding:4px 8px 14px;
  font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-strong)}
.wordmark-dots{display:inline-flex;gap:3px}
.wordmark-dots i{width:7px;height:7px;border-radius:50%}
.side-nav{flex:1;display:grid;align-content:start;gap:2px}
.side-link{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  color:var(--ink-2);font-size:15px;transition:background-color var(--t-fast) ease,color var(--t-fast) ease}
.side-link:hover{background:var(--line-soft);color:var(--ink-strong)}
.side-link.active{background:var(--line-soft);color:var(--ink-strong);font-weight:600}
.side-link.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ink)}
.side-foot{display:grid;gap:8px;padding:12px 8px 4px;border-top:1px solid var(--line-soft)}
.icon-btn{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:transparent;color:var(--muted);cursor:pointer;
  font-family:var(--display);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.icon-btn:hover{color:var(--ink);border-color:var(--ink)}

/* page */
.page{flex:1;width:100%;max-width:1200px;padding:24px 28px 40px;display:grid;gap:20px;align-content:start}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.page-head h1{font-size:22px;font-weight:500;color:var(--ink-strong);line-height:1.2}
.page-head .sub{margin-top:4px;font-size:15px;color:var(--ink-2)}
.crumbs{display:flex;gap:6px;align-items:center;font-family:var(--display);font-size:11px;color:var(--muted)}
.crumbs a:hover{color:var(--ink)}

/* panels */
.panel{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;background:var(--card);min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel h2{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.panel-caption{margin:-6px 0 12px;font-size:14px;color:var(--muted)}

/* metric tiles */
.metric-grid{display:grid;gap:1px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--line)}
.metric{display:flex;flex-direction:column;gap:4px;padding:14px 18px 16px;background:var(--bg)}
.metric-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.metric-value{font-family:var(--display);font-size:26px;font-weight:500;line-height:1.2;color:var(--ink-strong);font-variant-numeric:tabular-nums}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.panel .table-wrap{border:0;border-radius:0;margin-inline:-16px}
.panel>.table-wrap:last-child{margin-bottom:-16px}
.panel .table-wrap .table th:first-child,.panel .table-wrap .table td:first-child{padding-left:16px}
.panel .table-wrap .table th:last-child,.panel .table-wrap .table td:last-child{padding-right:16px}
.table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.table th{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap;
  font-family:var(--display);font-size:10px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.table td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.table tbody tr:last-child td{border-bottom:0}
.table .primary{color:var(--ink-strong);font-weight:500}
.table tbody tr.clickable{cursor:pointer}
.table tbody tr.clickable:hover{background:var(--line-soft)}
.cell-msg{font-family:var(--mono);font-size:12px;color:var(--ink-2);word-break:break-word}

/* status dots & verdicts */
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:11px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--s,var(--muted))}
.status-pass,.status-met{--s:var(--green)}
.status-fail,.status-not_met{--s:var(--red)}
.status-warn{--s:var(--warn)}
.status-manual{--s:var(--muted)}
.verdict{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--s,var(--muted)) 45%,var(--line));
  background:color-mix(in srgb,var(--s,var(--muted)) 9%,transparent);
  font-family:var(--display);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.verdict::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--s,var(--muted))}
.verdict.pass{--s:var(--green)}.verdict.warn{--s:var(--warn)}.verdict.fail{--s:var(--red)}

/* severity text */
.sev{font-family:var(--display);font-size:11px;letter-spacing:.03em;text-transform:uppercase}
.sev-critical{color:var(--red);font-weight:600}.sev-high{color:var(--red)}
.sev-medium{color:var(--warn)}.sev-low{color:var(--muted)}.sev-info,.sev-unknown{color:var(--muted)}

/* chips / selects / segmented filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.input,select.input{padding:5px 12px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-family:var(--display);font-size:11.5px;cursor:pointer}
select.input:hover{border-color:var(--ink)}

.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line);background:transparent;font-family:var(--display);font-size:11px;color:var(--ink-2)}
.bar{display:inline-block;height:.6rem;border-radius:3px;background:var(--red);vertical-align:middle}
.nums{font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:10px}
.hbar-head{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.hbar-track{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.hbar-track span{display:block;height:100%;border-radius:3px;background:var(--ink)}
/* family cards: vivid pass/fail per check family */
.famgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.famcard{border:1px solid var(--line);border-left:3px solid var(--s,var(--line));border-radius:var(--r-md);padding:12px 14px;background:var(--bg)}
.famcard.pass{--s:var(--green)}.famcard.fail{--s:var(--red)}.famcard.warn{--s:var(--warn)}.famcard.idle{--s:var(--line)}
.famcard .fam-name{font-family:var(--display);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-strong)}
.famcard .fam-state{font-family:var(--display);font-size:11px;color:var(--s,var(--muted));margin-top:2px}
.famcard .fam-counts{margin-top:8px;font-size:14px;color:var(--ink-2)}
.famcard .fam-counts b{color:var(--ink-strong);font-size:20px;font-family:var(--display)}
details.snippet summary{cursor:pointer;color:var(--muted);font-family:var(--display);font-size:11px;letter-spacing:.04em;text-transform:uppercase;list-style:none}
details.snippet summary::-webkit-details-marker{display:none}
details.snippet summary::before{content:"› ";}
details.snippet[open] summary::before{content:"⌄ ";}
.msgs{margin:.4rem 0 0;padding-left:1.1rem;display:grid;gap:3px;font-size:14px}
.callout{padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--canvas);font-size:14px;color:var(--ink-2)}
.empty{padding:28px 12px;text-align:center;font-family:var(--display);font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 24px;margin:0}
.kv>div{display:grid;gap:2px;align-content:start}
.kv dt{font-family:var(--display);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:2px 0 0;font-size:15px;color:var(--ink);word-break:break-word}

@media (max-width:860px){.app{grid-template-columns:1fr}.sidebar{flex-direction:row;height:auto;position:static;flex-wrap:wrap}
  .side-nav{grid-auto-flow:column;gap:4px}.side-link.active::before{display:none}.page{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="wordmark" href="/">
      <span class="wordmark-dots"><i style="background:var(--green)"></i><i style="background:var(--warn)"></i><i style="background:var(--red)"></i></span>
      Gatehouse
    </a>
    <nav class="side-nav">
      <a class="side-link" href="/">Dashboard</a>
      <a class="side-link" href="/projects">Projects</a>
      <a class="side-link" href="/history">History</a>
      <a class="side-link" href="/waivers">Waivers</a>
      <a class="side-link" href="/policies">Policies</a>
      <a class="side-link" href="/settings">Settings</a>
    </nav>
    <div class="side-foot">
      <button class="icon-btn" id="theme-toggle" type="button">Toggle theme</button>
      <span class="label">local pre-push gate</span>
    </div>
  </aside>
  <div class="main">
    <main class="page">
{{end}}

{{define "foot"}}
    </main>
  </div>
</div>
</body></html>{{end}}
